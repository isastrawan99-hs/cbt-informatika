<style>
  :root {
    --navy: #0f294a;
    --navy-dark: #091b33;
    --blue-primary: #1d4ed8;
    --blue-hover: #1e40af;
    --blue-light: #e0f2fe;
    --blue-soft: #f0f7ff;
    --white: #ffffff;
    --bg-page: #f1f5f9;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --gray-bg: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
    --shadow-md: 0 4px 16px rgba(15, 41, 74, 0.1);
    --radius: 12px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .hidden { display: none !important; }
  .page { min-height: 100vh; }

  /* ==========================================================================
     BUTTONS
  ========================================================================== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    padding: 12px 18px;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    min-height: 46px;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-block { width: 100%; }
  .btn-lg { padding: 14px 22px; font-size: 1rem; min-height: 52px; }
  .btn-sm { padding: 8px 12px; font-size: 0.85rem; min-height: 38px; }

  .btn-primary { background: var(--blue-primary); color: var(--white); }
  .btn-primary:hover:not(:disabled) { background: var(--blue-hover); }

  .btn-secondary { background: #e2e8f0; color: var(--navy); }
  .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }

  .btn-success { background: var(--success); color: var(--white); }
  .btn-success:hover:not(:disabled) { background: #15803d; }

  .btn-danger { background: var(--danger); color: var(--white); }
  .btn-danger:hover:not(:disabled) { background: #b91c1c; }

  .btn-outline-light {
    background: rgba(255, 255, 255, 0.12);
    color: var(--white);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  /* ==========================================================================
     LOADING & TOAST
  ========================================================================== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(9, 27, 51, 0.75);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader-card {
    background: var(--white);
    padding: 28px 36px;
    border-radius: var(--radius);
    text-align: center;
    box-shadow: var(--shadow-md);
  }

  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid var(--blue-light);
    border-top-color: var(--blue-primary);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy-dark);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 9500;
    box-shadow: var(--shadow-md);
  }

  /* ==========================================================================
     HALAMAN 1: LOGIN SISWA
  ========================================================================== */
  .login-wrapper {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 55%, var(--blue-primary) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .login-card {
    background: var(--white);
    width: 100%;
    max-width: 520px;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  }

  .login-header {
    text-align: center;
    margin-bottom: 20px;
  }

  .school-badge {
    width: 54px;
    height: 54px;
    background: var(--blue-light);
    color: var(--blue-primary);
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }

  .school-name {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--blue-primary);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .app-title {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--navy);
    margin: 4px 0 8px;
  }

  .subject-pill {
    display: inline-block;
    background: var(--navy);
    color: var(--white);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 99px;
  }

  .instruction-box {
    background: var(--blue-soft);
    border-left: 4px solid var(--blue-primary);
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 0.85rem;
  }

  .instruction-box h3 {
    font-size: 0.9rem;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .instruction-box ul {
    padding-left: 18px;
    color: var(--text-muted);
  }

  .instruction-box li { margin-bottom: 4px; }

  .form-group { margin-bottom: 16px; }
  .form-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  @media (min-width: 480px) {
    .form-row { grid-template-columns: 1.3fr 1fr; }
    .login-card { padding: 34px 32px; }
  }

  label {
    display: block;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .req { color: var(--danger); }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 1rem;
    color: var(--text-main);
    background: var(--white);
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--blue-primary);
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
  }

  .alert-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #fca5a5;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 16px;
  }

  /* ==========================================================================
     HALAMAN 2: PENGERJAAN SOAL
  ========================================================================== */
  .exam-topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--navy);
    color: var(--white);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: var(--shadow-md);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .student-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--blue-primary);
    color: var(--white);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .student-meta {
    overflow: hidden;
  }

  .student-name {
    font-weight: 700;
    font-size: 0.92rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .student-sub {
    font-size: 0.78rem;
    color: #93c5fd;
  }

  .violation-badge {
    display: inline-block;
    margin-top: 3px;
    background: rgba(220, 38, 38, 0.25);
    border: 1px solid rgba(248, 113, 113, 0.6);
    color: #fecaca;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
  }

  .timer-box {
    background: var(--navy-dark);
    border: 1.5px solid #38bdf8;
    color: #e0f2fe;
    padding: 6px 14px;
    border-radius: 99px;
    font-weight: 800;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
  }

  .timer-box.warning {
    border-color: var(--danger);
    background: #450a0a;
    color: #fecaca;
    animation: pulse 1s infinite;
  }

  @keyframes pulse { 50% { opacity: 0.75; } }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-wrapper {
    background: var(--white);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }

  .progress-info {
    max-width: 1200px;
    margin: 0 auto 6px;
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .save-status { color: var(--success); font-weight: 600; }

  .progress-track {
    max-width: 1200px;
    margin: 0 auto;
    height: 8px;
    background: var(--gray-bg);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--blue-primary);
    transition: width 0.3s ease;
  }

  .exam-container {
    max-width: 1200px;
    margin: 16px auto;
    padding: 0 16px 40px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 920px) {
    .exam-container {
      grid-template-columns: 1fr 330px;
      align-items: start;
    }
    .mobile-only { display: none !important; }
  }

  .question-panel {
    background: var(--white);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }

  .question-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--gray-bg);
  }

  .q-badge {
    background: var(--navy);
    color: var(--white);
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
  }

  .q-badge small { font-weight: 500; opacity: 0.8; }

  .q-category {
    background: var(--blue-light);
    color: var(--navy);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 99px;
  }

  .q-image-box {
    margin-bottom: 16px;
    text-align: center;
    background: #f8fafc;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .q-image-box img {
    max-width: 100%;
    max-height: 280px;
    border-radius: 6px;
  }

  .q-text {
    font-size: 1.05rem;
    color: var(--text-main);
    white-space: pre-line;
    margin-bottom: 22px;
    font-weight: 500;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--white);
  }

  .option-item:hover {
    border-color: #93c5fd;
    background: var(--blue-soft);
  }

  .option-item.selected {
    border-color: var(--blue-primary);
    background: var(--blue-soft);
  }

  .option-letter {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--gray-bg);
    color: var(--navy);
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .option-item.selected .option-letter {
    background: var(--blue-primary);
    color: var(--white);
  }

  .option-text {
    font-size: 0.98rem;
    padding-top: 4px;
  }

  .question-footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--gray-bg);
  }

  .btn-nav { flex: 1; max-width: 210px; }

  /* Panel Navigasi Nomor */
  .nav-panel {
    background: var(--white);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }

  @media (max-width: 919px) {
    .nav-panel {
      position: fixed;
      inset: 0;
      z-index: 500;
      border-radius: 0;
      overflow-y: auto;
      display: none;
    }
    .nav-panel.open { display: block; }
  }

  .nav-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .btn-close {
    background: none;
    border: none;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
    color: var(--navy);
  }

  .nav-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--gray-bg);
  }

  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 4px;
  }
  .dot-answered { background: var(--blue-primary); }
  .dot-unanswered { background: var(--white); border: 1.5px solid var(--border); }
  .dot-green { background: var(--success); }
  .dot-red { background: var(--danger); }
  .dot-gray { background: #94a3b8; }

  .number-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }

  .num-btn {
    height: 42px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--text-main);
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .num-btn.answered {
    background: var(--blue-primary);
    border-color: var(--blue-primary);
    color: var(--white);
  }

  .num-btn.active {
    box-shadow: 0 0 0 3px var(--navy);
  }

  .num-btn.rev-correct { background: var(--success); border-color: var(--success); color: var(--white); }
  .num-btn.rev-wrong { background: var(--danger); border-color: var(--danger); color: var(--white); }
  .num-btn.rev-empty { background: #94a3b8; border-color: #94a3b8; color: var(--white); }

  /* ==========================================================================
     HALAMAN 3: HASIL UJIAN DAN PEMBAHASAN
  ========================================================================== */
  .result-container {
    max-width: 1150px;
    margin: 0 auto;
    padding: 20px 16px 50px;
  }

  .result-summary-card {
    background: var(--white);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .result-banner {
    background: linear-gradient(135deg, var(--navy-dark), var(--navy));
    color: var(--white);
    padding: 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .badge-done {
    display: inline-block;
    background: var(--success);
    color: var(--white);
    font-size: 0.75rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    margin-bottom: 8px;
  }

  .result-banner h2 { font-size: 1.35rem; margin-bottom: 4px; }
  .result-banner p { color: #93c5fd; font-size: 0.9rem; }

  .score-circle {
    background: var(--white);
    color: var(--navy);
    padding: 14px 24px;
    border-radius: 14px;
    text-align: center;
    min-width: 135px;
  }

  .score-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--text-muted);
  }

  .score-value {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--blue-primary);
    line-height: 1.1;
  }

  .result-grid-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--gray-bg);
  }

  .info-item .lbl {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .info-item .val {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--navy);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 20px 24px;
  }

  @media (min-width: 640px) {
    .stats-row { grid-template-columns: repeat(4, 1fr); }
  }

  .stat-box {
    padding: 14px;
    border-radius: 12px;
    text-align: center;
  }

  .stat-box b { display: block; font-size: 1.5rem; }
  .stat-box span { font-size: 0.82rem; font-weight: 600; }

  .stat-total { background: var(--blue-soft); color: var(--navy); }
  .stat-correct { background: var(--success-bg); color: var(--success); }
  .stat-wrong { background: var(--danger-bg); color: var(--danger); }
  .stat-empty { background: var(--gray-bg); color: var(--text-muted); }

  .review-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 900px) {
    .review-layout {
      grid-template-columns: 1fr 320px;
      align-items: start;
    }
  }

  .review-card, .review-nav-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 22px 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--gray-bg);
  }

  .status-tag {
    font-size: 0.8rem;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 99px;
  }

  .status-tag.BENAR { background: var(--success-bg); color: var(--success); }
  .status-tag.SALAH { background: var(--danger-bg); color: var(--danger); }
  .status-tag.KOSONG { background: var(--gray-bg); color: var(--text-muted); }

  .review-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .rev-opt {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .rev-opt.is-key {
    background: var(--success-bg);
    border-color: var(--success);
    color: #14532d;
    font-weight: 600;
  }

  .rev-opt.is-user-wrong {
    background: var(--danger-bg);
    border-color: var(--danger);
    color: #7f1d1d;
  }

  .answer-comparison {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    background: #f8fafc;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    font-size: 0.92rem;
  }

  .explanation-box {
    background: var(--blue-soft);
    border-left: 4px solid var(--blue-primary);
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
  }

  .explanation-box h4 {
    color: var(--navy);
    font-size: 0.9rem;
    margin-bottom: 6px;
  }

  .explanation-box p {
    font-size: 0.94rem;
    color: var(--text-main);
  }

  /* ==========================================================================
     MODALS
  ========================================================================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(9, 27, 51, 0.75);
    backdrop-filter: blur(3px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-box {
    background: var(--white);
    width: 100%;
    max-width: 440px;
    border-radius: 16px;
    padding: 26px 24px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }

  .modal-box.border-danger { border-top: 6px solid var(--danger); }

  .modal-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 1.5rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
  }

  .modal-icon.info { background: var(--blue-light); color: var(--blue-primary); }
  .modal-icon.warning { background: var(--warning-bg); color: var(--warning); }
  .modal-icon.danger { background: var(--danger-bg); color: var(--danger); }

  .modal-box h3 { margin-bottom: 10px; color: var(--navy); }
  .text-danger { color: var(--danger) !important; }
  .text-success { color: var(--success) !important; }
  .text-muted { color: var(--text-muted); }
  .small { font-size: 0.85rem; }

  .confirm-summary {
    background: var(--blue-soft);
    padding: 12px;
    border-radius: 10px;
    margin: 14px 0;
    text-align: left;
    font-size: 0.92rem;
